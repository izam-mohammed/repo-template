<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-labelledby="t d">
  <title id="t">repo-template</title>
  <desc id="d">A round ceiling smoke alarm with a red light, chirping. Every new repository comes with it fitted: it goes off when you commit a key, and at 3am for no reason.</desc>

  <rect width="1200" height="400" rx="24" fill="#ffffff"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">
    <text x="64" y="92" font-size="16" fill="#5b6678">~ new repo, fire-safety compliant</text>
    <text x="62" y="166" font-size="64" font-weight="700" fill="#0f172a">repo-template</text>
    <text x="64" y="214" font-size="20" fill="#334155">Every new repo ships with a smoke alarm fitted.</text>
    <text x="64" y="246" font-size="20" fill="#5b6678">It goes off when you commit a key. And at 3am.</text>

    <g font-size="15">
      <rect x="64" y="292" width="150" height="34" rx="17" fill="#ffffff" stroke="#cbd5e1"/>
      <text x="139" y="314" text-anchor="middle" fill="#334155">sniffs secrets</text>
      <rect x="226" y="292" width="204" height="34" rx="17" fill="#ffffff" stroke="#cbd5e1"/>
      <text x="328" y="314" text-anchor="middle" fill="#334155">chirps about updates</text>
      <rect x="442" y="292" width="168" height="34" rx="17" fill="#ffffff" stroke="#cbd5e1"/>
      <text x="526" y="314" text-anchor="middle" fill="#334155">comes pre-fitted</text>
    </g>

    <!-- the alarm -->
    <circle cx="890" cy="196" r="128" fill="#f5f5f4" stroke="#a8a29e" stroke-width="3"/>
    <circle cx="890" cy="196" r="100" fill="none" stroke="#a8a29e" stroke-width="2"/>
    <circle cx="890" cy="196" r="78" fill="none" stroke="#d6d3d1" stroke-width="7" stroke-dasharray="12 9"/>
    <circle cx="890" cy="196" r="56" fill="none" stroke="#d6d3d1" stroke-width="7" stroke-dasharray="10 8"/>
    <circle cx="890" cy="196" r="32" fill="#ffffff" stroke="#a8a29e" stroke-width="2"/>
    <text x="890" y="202" font-size="15" font-weight="700" text-anchor="middle" fill="#44403c">TEST</text>
    <circle cx="960" cy="128" r="9" fill="#ef4444"/>
    <circle cx="960" cy="128" r="16" fill="#ef4444" fill-opacity="0.25"/>

    <!-- the chirp -->
    <g fill="none" stroke="#ef4444" stroke-width="5" stroke-linecap="round">
      <path d="M1030 104 Q1046 130 1046 160"/>
      <path d="M1060 80 Q1082 116 1082 160"/>
    </g>
    <text x="1060" y="60" font-size="20" font-weight="700" fill="#dc2626">chirp.</text>
    <text x="890" y="364" font-size="14" text-anchor="middle" fill="#5b6678">(low battery. probably.)</text>
  </g>
</svg>
