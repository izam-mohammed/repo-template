version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Kolkata
    open-pull-requests-limit: 3
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci(deps)
    assignees: [izam-mohammed]
    labels: ["dependencies", "github_actions", "ci"]
    groups:
      actions:
        patterns: ["*"]
        update-types: [minor, patch]

  # Bumps the `rev:` pins in .pre-commit-config.yaml.
  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Kolkata
    open-pull-requests-limit: 3
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore(deps)
    assignees: [izam-mohammed]
    labels: ["dependencies", "pre_commit"]
    groups:
      pre-commit:
        patterns: ["*"]
        update-types: [minor, patch]

  # A repository made from this template: uncomment this block and set
  # `package-ecosystem` to its manager (uv | npm | pip | cargo | gomod |
  # gradle | swift | docker | ...), with `directory` where the manifest
  # lives. Add one block per ecosystem; a monorepo adds one per app dir.
  # It stays commented here because the template has no manifest, and an
  # active block with nothing to read fails on every run.
  #
  # `labels` names the ecosystem's label (uv: python:uv, npm: javascript,
  # pip: python, cargo: rust, gomod: go, docker: docker); Dependabot does
  # not create labels once they are set, so the repository needs them.
  # `semver-major-days` only applies to managers that use SemVer.
  #
  # - package-ecosystem: uv
  #   directory: /
  #   schedule:
  #     interval: weekly
  #     day: monday
  #     time: "09:00"
  #     timezone: Asia/Kolkata
  #   open-pull-requests-limit: 3
  #   cooldown:
  #     default-days: 7
  #     semver-major-days: 30
  #   commit-message:
  #     prefix: chore(deps)
  #   assignees: [izam-mohammed]
  #   labels: ["dependencies", "python:uv"]
  #   groups:
  #     dependencies:
  #       patterns: ["*"]
  #       update-types: [minor, patch]
