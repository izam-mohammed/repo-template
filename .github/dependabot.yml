version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci(deps)
    groups:
      actions:
        patterns: ["*"]

  # Bumps the `rev:` pins in .pre-commit-config.yaml.
  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore(deps)
    groups:
      pre-commit:
        patterns: ["*"]

  # A repository made from this template: uncomment this block and set
  # `package-ecosystem` to its manager (uv | npm | pip | cargo | gomod |
  # gradle | swift | docker | ...), with `directory` where the manifest
  # lives. Add one block per ecosystem; a monorepo adds one per app dir.
  # It stays commented here because the template has no manifest, and an
  # active block with nothing to read fails on every run.
  #
  # - package-ecosystem: uv
  #   directory: /
  #   schedule:
  #     interval: weekly
  #   cooldown:
  #     default-days: 7
  #   commit-message:
  #     prefix: chore(deps)
  #   groups:
  #     dependencies:
  #       patterns: ["*"]
